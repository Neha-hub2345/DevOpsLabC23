<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bootstrap Calculator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="text-center mb-4">Simple Calculator</h2>

        <div class="mb-3">
            <label class="form-label">First Number</label>
            <input type="number" id="num1" class="form-control" placeholder="Enter first number">
        </div>

        <div class="mb-3">
            <label class="form-label">Second Number</label>
            <input type="number" id="num2" class="form-control" placeholder="Enter second number">
        </div>

        <div class="mb-3">
            <label class="form-label">Operation</label>
            <select id="operation" class="form-select">
                <option value="+">Addition (+)</option>
                <option value="-">Subtraction (-)</option>
                <option value="*">Multiplication (*)</option>
                <option value="/">Division (/)</option>
            </select>
        </div>

        <button class="btn btn-primary w-100" onclick="calculate()">
            Calculate
        </button>

        <div class="alert alert-success mt-3">
            <strong>Result:</strong>
            <span id="result">0</span>
        </div>
    </div>
</div>

<script>
function calculate() {
    let num1 = parseFloat(document.getElementById("num1").value);
    let num2 = parseFloat(document.getElementById("num2").value);
    let op = document.getElementById("operation").value;
    let result;

    if (isNaN(num1) || isNaN(num2)) {
        document.getElementById("result").innerHTML = "Please enter both numbers.";
        return;
    }

    switch (op) {
        case "+":
            result = num1 + num2;
            break;
        case "-":
            result = num1 - num2;
            break;
        case "*":
            result = num1 * num2;
            break;
        case "/":
            if (num2 === 0) {
                result = "Cannot divide by zero";
            } else {
                result = num1 / num2;
            }
            break;
    }

    document.getElementById("result").innerHTML = result;
}
</script>

</body>
</html>
